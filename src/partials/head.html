<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<meta name="robots" content="{{page.robots}}">
{{#if page.canonical}}<link rel="canonical" href="{{page.canonical}}">{{/if}}
<meta name="theme-color" content="#0b2545">
{{#if site.demo}}<meta name="demo-mode" content="true">{{/if}}
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
{{#if hero.srcset}}<link rel="preload" as="image" imagesrcset="{{hero.srcset}}" imagesizes="100vw" fetchpriority="high">{{/if}}
<meta property="og:type" content="website">
<meta property="og:locale" content="{{site.locale}}">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
{{#if page.canonical}}<meta property="og:url" content="{{page.canonical}}">{{/if}}
<meta property="og:image" content="{{page.ogImageUrl}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{page.ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.title}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{page.ogImageUrl}}">
<meta name="twitter:image:alt" content="{{page.ogImageAlt}}">
{{jsonld}}
